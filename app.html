Google Drive.\u003c/p>\u003cbutton type=\"button\" id=\"downloadLibraryOnly\" class=\"library-download-icon\" aria-label=\"Download complete Prompt Library only\" title=\"Download Prompt Library only\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5\">\u003c/path>\u003c/svg>\u003c/button>\u003cbutton type=\"button\" id=\"refreshLibrary\" class=\"library-download-icon library-refresh-icon\" aria-label=\"Refresh: save to Drive and start a new version\" title=\"Refresh: save to Drive now and start a new version\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M20 11a8 8 0 0 0-14.6-4.5L3 9M3 4v5h5M4 13a8 8 0 0 0 14.6 4.5L21 15M21 20v-5h-5\">\u003c/path>\u003c/svg>\u003c/button>\u003c/header>\n\u003cdiv id=\"libraryDownloadError\" class=\"library-download-error\" role=\"alert\">\u003c/div>\u003cdiv class=\"wrap\">\n\u003cnav class=\"view-switch\" aria-label=\"Choose library view\">\n  \u003cbutton type=\"button\" class=\"view-option\" id=\"showIndex\" aria-pressed=\"false\">Index\u003c/button>\n  \u003cbutton type=\"button\" class=\"view-option active\" id=\"showPrompt\" aria-pressed=\"true\">Prompt\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"view-viewport show-prompt\" id=\"viewViewport\">\n\u003cdiv class=\"view-track\" id=\"viewTrack\">\n\u003caside class=\"view-panel\" id=\"indexPane\" aria-label=\"Prompt index\">\n\u003cdiv class=\"head\">\u003cstrong id=\"indexHeading\">Index\u003c/strong>\u003cspan class=\"muted\" id=\"count\">\u003c/span>\u003c/div>\n\u003cdiv class=\"search-row\">\u003cinput id=\"search\" class=\"search\" type=\"search\" placeholder=\"Search titles, categories, or prompt text…\" aria-label=\"Search prompts\">\u003cselect id=\"indexCategory\" class=\"search\" aria-label=\"Choose category\">\u003coption value=\"\">All categories\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"toolbar\" id=\"selectionToolbar\">\u003cbutton class=\"btn\" id=\"checkall\">Select all\u003c/button>\u003cbutton class=\"btn\" id=\"clear\">Clear selected\u003c/button>\u003c/div>\n\u003cul id=\"entries\">\u003c/ul>\n\u003cp class=\"fine\" id=\"indexNote\">Drag a prompt by ⠿ to reorder or move it. The bin beside an active prompt or category moves it into Archive.\u003c/p>\n\u003cdiv class=\"toolbar\" id=\"selectionActions\">\u003cbutton class=\"btn\" id=\"copyselected\">Copy selected\u003c/button>\u003cbutton class=\"btn\" id=\"exportselected\">Download selected (.txt)\u003c/button>\u003c/div>\n\u003cp class=\"fine\">Plain-text downloads contain only prompt content. Multiple selected prompts are separated by blank lines, with no headings, code formatting, or JSON.\u003c/p>\n\u003cdetails class=\"save-panel save-dropdown\" id=\"saveIndexDetails\">\u003csummary class=\"save-dropdown-summary\">\u003cspan>Save &amp; library tools\u003c/span>\u003cspan class=\"save-dropdown-caret\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"save-dropdown-content\">\n \u003cp class=\"fine backup-notice\">This is a library-only sharing copy. Saves here include this library only. Open the full AI Engineer workspace for combined saves and AI Engineer version cleanup.\u003c/p>\n \u003cdiv class=\"backup-folder-box\">\u003cbutton type=\"button\" class=\"btn confirmed\" id=\"chooseFolderIndex\">📁 Choose Backup Folder\u003cspan class=\"click-indicator\">✓\u003c/span>\u003c/button>\u003cspan class=\"folder-label\" id=\"folderStatusIndex\" role=\"status\">\u003cb>Backup folder:\u003c/b> Checking browser permission…\u003c/span>\u003c/div>\n \u003cp class=\"backup-help\">In this standalone copy, normal backups contain the library only. Choose a folder to save verified Prompt Library versions; only older numbered Prompt Library backups are cleaned up. Inside AI Engineer, all normal saves use the whole-workspace backup service instead.\u003c/p>\n \u003cdiv class=\"save-actions-row\">\u003cbutton class=\"btn\" id=\"downloadallIndex\">Download all prompts (.txt)\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"openRulesdownloadallIndex\">LIBRARY RULES &amp; AI HANDOFF\u003c/button>\u003cbutton class=\"btn archive-action-btn\" type=\"button\" id=\"openArchivesIndex\">Archives\u003c/button>\u003c/div>\u003cdiv class=\"status\" id=\"statusIndex\" role=\"status\">\u003c/div>\u003c/div>\u003c/details>\n\u003c/aside>\n\u003cmain class=\"view-panel\" id=\"promptPane\" aria-label=\"Prompt content\">\n\u003cdiv class=\"head\">\u003cstrong>Content / prompt\u003c/strong>\u003cspan class=\"muted\">Full-width reader\u003c/span>\u003c/div>\n\u003cdiv id=\"viewer\">\u003c/div>\n\u003cdiv class=\"update-area\">\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" id=\"updateprompt\">Update\u003c/button>\u003cbutton class=\"btn\" id=\"addnew\">Add New Prompt\u003c/button>\u003c/div>\n\u003cdiv id=\"editorPanel\" class=\"editor-panel\" hidden=\"\">\n\u003ch3 id=\"editorHeading\">Add New Prompt\u003c/h3>\u003cp class=\"fine\" id=\"editorHint\">Enter a new title, select or type a category, and paste the full original prompt exactly as written.\u003c/p>\n\u003cdiv class=\"form-grid\">\u003cdiv>\u003clabel class=\"field\" for=\"editTitle\">Title\u003c/label>\u003cinput class=\"field-input\" id=\"editTitle\" placeholder=\"Prompt title\">\u003c/div>\u003cdiv>\u003clabel class=\"field\" for=\"editCategory\">Category (choose existing or type a new one)\u003c/label>\u003cinput class=\"field-input\" id=\"editCategory\" list=\"categoriesList\" placeholder=\"Category name\">\u003cdatalist id=\"categoriesList\">\u003coption value=\"Image Editor\">\u003c/option>\u003coption value=\"Character Headshots (6 Angle)\">\u003c/option>\u003coption value=\"Character Full Body (3 Angle)\">\u003c/option>\u003coption value=\"Character Sheet\">\u003c/option>\u003coption value=\"AI Engineer\">\u003c/option>\u003coption value=\"Univeral Video Generator\">\u003c/option>\u003coption value=\"Personal Life\">\u003c/option>\u003coption value=\"Content Creation\">\u003c/option>\u003coption value=\"Knowledge\">\u003c/option>\u003coption value=\"Book Decoder\">\u003c/option>\u003coption value=\"YouTube Decoder\">\u003c/option>\u003c/datalist>\u003c/div>\u003c/div>\n\u003clabel class=\"field prompt-label\" for=\"editContent\">Full prompt text — preserved verbatim\u003c/label>\u003ctextarea class=\"edit-text\" id=\"editContent\" spellcheck=\"false\" placeholder=\"Paste the complete prompt text here...\">\u003c/textarea>\n\u003cbutton type=\"button\" class=\"additional-toggle\" id=\"additionalToggle\" aria-expanded=\"false\" aria-controls=\"additionalEditor\">\u003cspan>Additional Info \u003cspan class=\"muted\">(optional)\u003c/span>\u003c/span>\u003cspan class=\"chevron\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n\u003cdiv class=\"additional-editor\" id=\"additionalEditor\" hidden=\"\">\n  \u003clabel class=\"field\" for=\"extraTitle\">Additional Info title\u003c/label>\n  \u003cinput class=\"field-input\" id=\"extraTitle\" placeholder=\"For example: Essential settings — Recommended generation settings\">\n  \u003clabel class=\"field\" for=\"extraContent\">Additional Info content\u003c/label>\n  \u003ctextarea class=\"edit-text\" id=\"extraContent\" spellcheck=\"false\" placeholder=\"Paste notes, a Markdown table, an Excel table, CSV, bullet points, or formatted text...\">\u003c/textarea>\n  \u003cdiv class=\"note-import-line\">\u003cbutton class=\"btn\" type=\"button\" id=\"importNoteBtn\">Import text / table file\u003c/button>\u003cinput type=\"file\" id=\"importNoteFile\" accept=\".txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,text/plain,text/markdown,text/csv,text/tab-separated-values,text/html,application/json\" hidden=\"\">\u003csmall>Supports pasted Excel cells, Markdown, CSV/TSV and safe HTML tables.\u003c/small>\u003c/div>\n  \u003cp class=\"fine\">Your prompt text stays separate from Additional Info. Table and text formatting are automatically shown in the preview and prompt reader.\u003c/p>\n  \u003cdiv class=\"additional-preview\">\u003cp class=\"preview-title\">Additional Info preview\u003c/p>\u003csection id=\"extraPreview\" class=\"extra-info\">\u003cdiv class=\"fine\">Start typing to preview the formatting.\u003c/div>\u003c/section>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton type=\"button\" class=\"btn\" id=\"saveedit\" title=\"Save this update and download a complete HTML backup\">Add new prompt\u003c/button>\u003cbutton class=\"btn\" id=\"canceledit\">Cancel\u003c/button>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdetails class=\"save-panel save-dropdown\" id=\"savePromptDetails\">\u003csummary class=\"save-dropdown-summary\">\u003cspan>Save &amp; library tools\u003c/span>\u003cspan class=\"save-dropdown-caret\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"save-dropdown-content\">\n \u003cp class=\"fine backup-notice\">This is a library-only sharing copy. Saves here include this library only. Open the full AI Engineer workspace for combined saves and AI Engineer version cleanup.\u003c/p>\n \u003cdiv class=\"backup-folder-box\">\u003cbutton type=\"button\" class=\"btn\" id=\"chooseFolder\">📁 Choose Backup Folder\u003c/button>\u003cspan class=\"folder-label\" id=\"folderStatus\" role=\"status\">\u003cb>Backup folder:\u003c/b> Checking browser permission…\u003c/span>\u003c/div>\n \u003cp class=\"backup-help\">In this standalone copy, normal backups contain the library only. Choose a folder to save verified Prompt Library versions; only older numbered Prompt Library backups are cleaned up. Inside AI Engineer, all normal saves use the whole-workspace backup service instead.\u003c/p>\n \u003cdiv class=\"save-actions-row\">\u003cbutton class=\"btn\" id=\"downloadall\">Download all prompts (.txt)\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"openRulesdownloadall\">LIBRARY RULES &amp; AI HANDOFF\u003c/button>\u003cbutton class=\"btn archive-action-btn\" type=\"button\" id=\"openArchives\">Archives\u003c/button>\u003c/div>\u003cdiv class=\"status\" id=\"status\" role=\"status\">\u003c/div>\u003c/div>\u003c/details>\n\u003c/main>\n\u003c/div>\n\u003cdiv class=\"custom-scroll\" id=\"customScroll\" aria-label=\"Vertical scrolling control\">\n  \u003cdiv class=\"custom-scroll-thumb\" id=\"scrollThumb\" role=\"scrollbar\" tabindex=\"0\" aria-label=\"Drag to scroll\" aria-orientation=\"vertical\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"100\" aria-valuetext=\"100% scrolled\" style=\"height: 70px; top: 458px;\">\n    \u003cspan class=\"grip-bars\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"modal-backdrop archive-backdrop\" id=\"archiveModal\" hidden=\"\">\n  \u003csection class=\"archive-dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"archiveTitle\" aria-describedby=\"archiveDescription\">\n    \u003cdiv class=\"archive-dialog-head\">\n      \u003cdiv>\u003ch2 id=\"archiveTitle\">Archives\u003c/h2>\u003cp id=\"archiveDescription\">Restore prompts to their original categories or permanently delete them after confirmation and PIN verification.\u003c/p>\u003c/div>\n      \u003cbutton type=\"button\" class=\"archive-close\" id=\"closeArchive\" aria-label=\"Close Archives\">×\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"archive-filters\">\n      \u003cinput id=\"archiveSearch\" type=\"search\" placeholder=\"Search archived titles, categories or prompt text…\" aria-label=\"Search archived prompts\">\n      \u003cselect id=\"archiveCategoryFilter\" aria-label=\"Filter archived prompts by category\">\u003coption value=\"\">All categories\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv id=\"archiveEntries\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"archive-footer\">\u003cspan id=\"archiveCount\">6 of 6 archived prompts\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"archiveDone\" aria-label=\"Delete all archives\" title=\"Delete all archives\">🗑\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"modal-backdrop\" id=\"deleteModal\" hidden=\"\">\n  \u003csection class=\"delete-dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"deleteTitle\" aria-describedby=\"deleteContext\">\n    \u003cdiv class=\"dialog-icon\" aria-hidden=\"true\">🗑\u003c/div>\n    \u003ch2 id=\"deleteTitle\">Are you sure, you want to delete ?\u003c/h2>\n    \u003cp id=\"deleteContext\">Move “Image To Video Generator” from the active library into Archive? You can restore it later. Nothing will be permanently deleted.\u003c/p>\n    \u003cdiv id=\"deleteConfirmStage\" class=\"modal-actions\">\n      \u003cbutton type=\"button\" class=\"btn modal-cancel\" id=\"deleteCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn modal-danger\" id=\"deleteConfirm\">Confirm\u003c/button>\n    \u003c/div>\n    \u003cform id=\"deletePinStage\" autocomplete=\"off\" novalidate=\"\" hidden=\"\">\n      \u003clabel for=\"deletePin\">Enter security PIN to permanently delete\u003c/label>\n      \u003cinput id=\"deletePin\" type=\"password\" inputmode=\"numeric\" pattern=\"[0-9]{4}\" maxlength=\"4\" minlength=\"4\" autocomplete=\"off\" spellcheck=\"false\" required=\"\" placeholder=\"****\" aria-describedby=\"pinHint pinError\">\n      \u003cdiv class=\"pin-help\">\u003cbutton type=\"button\" id=\"pinHintBtn\">Forgot PIN?\u003c/button>\u003cspan id=\"pinHint\" hidden=\"\">DOB Code\u003c/span>\u003c/div>\n      \u003cp class=\"pin-error\" id=\"pinError\" role=\"alert\">\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"btn modal-cancel\" id=\"pinCancel\">Cancel\u003c/button>\u003cbutton type=\"button\" class=\"btn modal-danger\" id=\"pinSubmit\">Permanently Delete\u003c/button>\u003c/div>\n    \u003cp class=\"pin-error\" id=\"deleteActionStatus\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003c/form>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"modal-backdrop\" id=\"rulesModal\" hidden=\"\">\n \u003csection class=\"rules-dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rulesTitle\">\n  \u003ch2 id=\"rulesTitle\">BIBA LIBRARY RULES &amp; AI HANDOFF\u003c/h2>\n  \u003cp>These instructions are embedded inside every exported HTML backup. Copy the Project Instructions once into your ChatGPT/Claude Project to apply the greeting preference consistently.\u003c/p>\n  \u003cdiv class=\"rules-tabs\" role=\"group\" aria-label=\"Instruction type\">\n   \u003cbutton type=\"button\" id=\"rulesProject\" class=\"active\" aria-pressed=\"true\">AI Project Instructions\u003c/button>\n   \u003cbutton type=\"button\" id=\"rulesManual\" aria-pressed=\"false\">Complete Library Rules\u003c/button>\n  \u003c/div>\n  \u003cpre id=\"rulesContent\" tabindex=\"0\">\u003c/pre>\n  \u003cdiv class=\"rules-actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copyRules\">Copy Instructions\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"downloadRules\">Download Instructions (.txt)\u003c/button>\u003cbutton class=\"btn close\" type=\"button\" id=\"closeRules\" aria-label=\"Close\" title=\"Close\">✕\u003c/button>\u003c/div>\n \u003c/section>\n\u003c/div>\n\u003cdiv class=\"modal-backdrop\" id=\"syncReminderModal\" hidden=\"\">\n  \u003csection class=\"sync-reminder-dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"syncReminderTitle\" aria-describedby=\"syncReminderMessage\">\n    \u003cdiv class=\"sync-reminder-icon\" aria-hidden=\"true\">✓\u003c/div>\n    \u003ch2 id=\"syncReminderTitle\">Reminder\u003c/h2>\n    \u003cp id=\"syncReminderMessage\">Share the downloaded file to update Prompt Library.\u003c/p>\n    \u003cdiv class=\"sync-reminder-actions\">\u003cbutton type=\"button\" class=\"btn\" id=\"syncReminderClose\" aria-label=\"Close\" title=\"Close\">✕\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\" class=\"\">\u003cspan class=\"toast-icon\">✓\u003c/span>\u003cspan class=\"toast-message\">New prompt added to Univeral Video Generator. Library v8.3. Saved in browser; saving local HTML backup…\u003c/span>\u003c/div>\n\u003cscript>\n'use strict';\nconst EMBEDDED = __AIE_DATA__;;\nconst KEY='chatgpt_prompt_library_grouped_v2';\nlet data=JSON.parse(JSON.stringify(EMBEDDED));\nlet active=null,openCategory=null,editorMode=null,editingUid=null,draggingUid=null;\nlet viewMode='index',deletionTarget=null; // Archive is managed in its own popup\nlet restoreFocus=null;\nconst selected=new Set();\nconst $=id=>document.getElementById(id);\nconst uid=e=>e.uid;\n\nfunction pane(){return $(viewMode==='prompt'?'promptPane':'indexPane');}\nfunction showView(which){\n  viewMode=which==='prompt'?'prompt':'index';\n  $('viewViewport').classList.toggle('show-prompt',viewMode==='prompt');\n  for(const [mode,buttonId] of [['index','showIndex'],['prompt','showPrompt']]){\n    const btn=$(buttonId);const on=mode===viewMode;\n    btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on));\n  }\n  requestAnimationFrame(updateScrollbar);\n}\nfunction updateScrollbar(){\n  const el=pane(),track=$('customScroll'),thumb=$('scrollThumb');\n  if(!el||!track||!thumb)return;\n  const max=Math.max(0,el.scrollHeight-el.clientHeight);\n  track.classList.toggle('inactive',max\u003c=2);\n  const height=track.clientHeight;\n  const thumbHeight=Math.min(height,Math.max(70,Math.round(height*el.clientHeight/Math.max(1,el.scrollHeight))));\n  const range=Math.max(0,height-thumbHeight);\n  const percent=max?Math.min(1,el.scrollTop/max):0;\n  thumb.style.height=thumbHeight+'px';thumb.style.top=(range*percent)+'px';\n  thumb.setAttribute('aria-valuenow',String(Math.round(100*percent)));\n  thumb.setAttribute('aria-valuetext',String(Math.round(100*percent))+'% scrolled');\n}\n$('showIndex').onclick=()=>showView('index');\n$('showPrompt').onclick=()=>showView('prompt');\nfor(const id of ['indexPane','promptPane'])$(id).addEventListener('scroll',updateScrollbar,{passive:true});\nwindow.addEventListener('resize',updateScrollbar);\nlet swipeStart=null;\n$('viewViewport').addEventListener('touchstart',ev=>{\n  if(ev.touches.length===1)swipeStart={x:ev.touches[0].clientX,y:ev.touches[0].clientY};\n},{passive:true});\n$('viewViewport').addEventListener('touchend',ev=>{\n  if(!swipeStart||!ev.changedTouches.length)return;\n  const dx=ev.changedTouches[0].clientX-swipeStart.x;\n  const dy=ev.changedTouches[0].clientY-swipeStart.y;\n  swipeStart=null;\n  if(Math.abs(dx)>95&&Math.abs(dx)>Math.abs(dy)*1.6)showView(dx\u003c0?'prompt':'index');\n},{passive:true});\nlet grab=null;\n$('scrollThumb').addEventListener('pointerdown',ev=>{\n  if($('customScroll').classList.contains('inactive'))return;\n  ev.preventDefault();ev.stopPropagation();\n  grab={pointer:ev.pointerId,y:ev.clientY,top:pane().scrollTop,mode:viewMode};\n  $('scrollThumb').setPointerCapture(ev.pointerId);\n});\n$('scrollThumb').addEventListener('pointermove',ev=>{\n  if(!grab||grab.pointer!==ev.pointerId)return;\n  const p=$(grab.mode==='prompt'?'promptPane':'indexPane');\n  const track=$('customScroll'),thumb=$('scrollThumb');\n  const travel=track.clientHeight-thumb.clientHeight;\n  if(travel>0)p.scrollTop=grab.top+(ev.clientY-grab.y)*(p.scrollHeight-p.clientHeight)/travel;\n});\n$('scrollThumb').addEventListener('pointerup',()=>{grab=null;});\n$('scrollThumb').addEventListener('pointercancel',()=>{grab=null;});\n$('customScroll').addEventListener('pointerdown',ev=>{\n  if(ev.target!==$('customScroll')||$('customScroll').classList.contains('inactive'))return;\n  const box=$('customScroll').getBoundingClientRect();\n  const thumb=$('scrollThumb');\n  con 'pinCancel').onclick=closeDeletion;\n$('deleteConfirm').onclick=()=>{\n  if(deletionTarget?.action==='archive'){archiveTargetNow();return;}\n  $('deleteConfirmStage').hidden=true;$('deletePinStage').hidden=false;\n  $('deletePin').focus();\n};\n$('pinHintBtn').onclick=()=>{$('pinHint').hidden=false;};\n$('deletePin').addEventListener('input',ev=>{\n  ev.target.value=ev.target.value.replace(/[^0-9]/g,'').slice(0,4);\n  $('pinError').textContent='';\n});\n$('deleteModal').addEventListener('click',ev=>{if(ev.target===$('deleteModal'))closeDeletion();});\ndocument.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('deleteModal').hidden){ev.stopImmediatePropagation();closeDeletion();}});\nfunction matchesPinLocalFallback(entered){\n  const txt=VERIFY_SALT+entered;\n  let a=2166136261,b=0x811c9dc5 ^ 0x9e3779b9;\n  for(let i=0;i\u003ctxt.length;i++){\n    a=Math.imul(a ^ txt.charCodeAt(i),16777619);\n    b=Math.imul(b ^ txt.charCodeAt(txt.length-i-1),16777619);\n  }\n  return [a>>>0,b>>>0].map(x=>x.toString(16).padStart(8,'0')).join('')===VERIFY_FALLBACK;\n}\nasync function matchesDeletePin(entered){\n  // Web Crypto may not be available when the HTML is opened offline or in a sandbox.\n  try{\n    if(typeof crypto!=='undefined'&&crypto.subtle&&typeof TextEncoder!=='undefined'){\n      const bytes=new TextEncoder().encode(VERIFY_SALT+entered);\n      const digest=await crypto.subtle.digest('SHA-256',bytes);\n      return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')===VERIFY_DIGEST;\n    }\n  }catch(e){ /* use the matching offline checker, without exposing the PIN */ }\n  return matchesPinLocalFallback(entered);\n}\nasync function executeVerifiedDeletion(ev){\n  // The PIN is reserved for irreversible deletion from Archive.\n  if(ev)ev.preventDefault();\n  if($('pinSubmit').disabled)return;\n  const attempted=$('deletePin').value.trim();\n  const feedback=$('deleteActionStatus');\n  if(!/^[0-9]{4}$/.test(attempted)){\n    $('pinError')
